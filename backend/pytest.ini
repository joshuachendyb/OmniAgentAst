[pytest]
pythonpath = . e2etests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
; ==========================================================
; 超时策略 — 仅此一处设置，测试脚本严禁手动设任何超时
; 触发后 pytest 强杀线程，ensure_backend_ready/会话恢复等
; 前置操作不受此超时影响（它们各自有 3s/10s 连接超时）
; -- 小欧 2026-07-03
; ==========================================================
timeout = 3000
; 排除模块级直跑脚本(导入即连后端,非 pytest 用例) — 小欧 2026-08-21
; E2E 全链路用例(e2e_full_link)默认纳入收集/运行(北京老陈 2026-08-21 要求去掉排除)
;   前提: 后端已启动(8000)+ 真实LLM可用; 后端未启动时这3个用例 assert ensure_backend_ready() 失败 -> 计入失败,属预期
addopts = --ignore=tests/test_chat_quick.py --ignore=tests/output --ignore-glob=tests/test_p9_*.py --ignore=tests/test_e2e_inj_03_triple_injection.py
; 2026-09-29 小欧 — 以下用例**必须跑到, 只是从单测主跑里隔离, 不是丢弃**:
;   tests/test_p9_*.py (7个) + tests/test_e2e_inj_03_triple_injection.py
;   原因: 它们是需要「活后端 + 真实LLM」的 E2E, 却放在单测目录(testpaths=tests)。
;         后端不通时 LLM 调用永久挂起 —— 实测 2026-09-29 全量单测在 33% 挂死 30 分钟,
;         且 test_p9_03 停在 asyncio select 无法自愈(诊断见 [76]会审报告 L-01/L-02-b)。
;   单独跑(一次只跑一个 case, 需后端已启动):
;     pytest e2etests/test_e2e_p9_01_empty_input.py --timeout=2900 -x -v
;     pytest tests/test_e2e_inj_03_triple_injection.py --timeout=2900 -x -v
;   正本在 e2etests/(INJ-01/02/03), tests/ 下为按需归档副本。
markers =
    e2e_full_link: full link E2E test
    asyncio: asyncio test