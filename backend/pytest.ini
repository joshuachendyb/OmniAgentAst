[pytest]
pythonpath = . e2etests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
; ==========================================================
; 超时策略 — 仅此一处设置，测试脚本严禁手动设任何超时
; 触发后 pytest 强杀线程，ensure_backend_ready/会话恢复等
; 前置操作不受此超时影响（它们各自有 3s/10s 连接超时）
; -- 小欧 2026-07-03
; ==========================================================
timeout = 3000
; 排除模块级直跑脚本(导入即连后端,非 pytest 用例) — 小欧 2026-08-21
; E2E 全链路用例(e2e_full_link)默认纳入收集/运行(北京老陈 2026-08-21 要求去掉排除)
;   前提: 后端已启动(8000)+ 真实LLM可用; 后端未启动时这3个用例 assert ensure_backend_ready() 失败 -> 计入失败,属预期
; 2026-09-29 小欧 — 全量必须包含 e2e 用例(北京老陈裁定), 故不排除 tests/ 下的 e2e case。
;   前提: 后端已启动(:8000) + 真实 LLM 可用, 否则真实 LLM 调用会挂住全量
;   (2026-09-29 曾因后端僵死 PID 16724 导致全量在 33% 挂死 30 分钟, 根因见 [76]会审报告 L-01/L-02-b)。
;   tests/test_p9_*.py(7个) 与 tests/test_e2e_inj_03_triple_injection.py 均纳入收集。
;   正本在 e2etests/(INJ-01/02/03), tests/ 下为全量可收的副本。
addopts = --ignore=tests/test_chat_quick.py --ignore=tests/output
markers =
    e2e_full_link: full link E2E test
    asyncio: asyncio test